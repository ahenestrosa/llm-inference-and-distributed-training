[project]
name = "llm-inference-and-distributed-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.*",
    "transformers>=4.48",
    "accelerate>=1.2",
    "bitsandbytes>=0.45",
    "autoawq",
    "peft",
    "datasets",
    "wandb",
    "matplotlib",
    "pandas",
    "optimum>=2.1.0",
    # Prebuilt wheel matching torch 2.8 (manylinux_2_28, cxx11abi=TRUE) — source build OOMs.
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

override-dependencies = [
    "triton>=3.0; sys_platform == 'linux'",
]

